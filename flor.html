
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #f8eee8, #f4dfe0, #eee5dc);
    overflow-x: hidden;
    padding: 20px 0;
}

.card {
    width: min(95%, 650px);
    min-height: 90vh;
    padding: 30px 15px;
    text-align: center;
    background: rgba(255,255,255,.65);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 28px;
    box-shadow: 0 15px 45px #94716d25;
    position: relative;
    overflow: hidden;
}

h1 {
    color: #79565b;
    font-size: 32px;
    margin: 5px 0 10px;
}

.intro {
    color: #98787a;
    font-size: 17px;
    margin: 15px 0;
}

/* FOTOGRAFÍA */
.foto-principal {
    width: 190px;
    height: 190px;
    margin: 15px auto;
    padding: 6px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 5px 20px #b77f8940;
    overflow: hidden;
}

.foto-principal img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}

/* ESCENA */
.scene {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* BOTÓN */
button {
    border: none;
    border-radius: 30px;
    padding: 17px 35px;
    color: white;
    background: #b77f89;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 18px #b77f8940;
    transition: .3s;
    font-family: inherit;
    margin: 15px auto 20px;
}

button:hover {
    background: #986570;
    transform: scale(1.05);
}

.scene.show button {
    display: none;
}

/* RAMO: NO OCUPA ESPACIO ANTES DE ABRIRSE */
.garden {
    width: 100%;
    max-width: 530px;
    height: 0;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transition: height 1s ease, opacity 1s ease;
}

.scene.show .garden {
    height: 490px;
    opacity: 1;
    margin-top: 10px;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}

/* TALLOS */
.stem {
    fill: none;
    stroke: #71866b;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 450;
    stroke-dashoffset: 450;
}

/* HOJAS */
.leaf {
    fill: #819579;
    stroke: #647b60;
    stroke-width: 1.5;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
}

/* ENVOLTORIO */
.wrapper {
    opacity: 0;
    transform: translateY(40px) scale(.8);
    transform-origin: center;
}

/* MOÑO */
.ribbon {
    opacity: 0;
}

/* FLORES */
.flower {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
    opacity: 0;
}

.petal {
    fill: #d99ca8;
    stroke: #c98694;
    stroke-width: 1;
}

.petal.light {
    fill: #e8b9bd;
    stroke: #d99da8;
}

.petal.cream {
    fill: #ead9b9;
    stroke: #d9c59e;
}

.flower-center {
    fill: #8c6b57;
    stroke: #725443;
    stroke-width: 2;
}

.center-dot {
    fill: #d9bd8f;
}

/* GATITOS */
.kittens {
    opacity: 0;
    transform: translateY(20px);
}

/* MENSAJE FINAL */
.message {
    display: none;
    color: #79565b;
    max-width: 500px;
    margin: 15px auto 25px;
}

.scene.show .message {
    display: block;
    animation: messageIn 1.5s 3.8s both;
}

.message h2 {
    font-size: 29px;
    margin-bottom: 8px;
}

.message p {
    font-size: 17px;
    line-height: 1.6;
    margin: 8px 15px;
}

/* ANIMACIONES */
.scene.show .wrapper {
    animation: wrapperIn 1.5s forwards;
}

.scene.show .stem {
    animation: growStem 2s ease forwards;
}

.scene.show .leaf {
    animation: leafIn 1s ease forwards;
}

.scene.show .flower {
    animation: bloom 1.2s ease-out forwards;
}

.scene.show .ribbon {
    animation: ribbonIn 1s 2s forwards;
}

.scene.show .kittens {
    animation: kittensIn 1.5s 3.2s forwards;
}

@keyframes wrapperIn {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes growStem {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes leafIn {
    to {
        transform: scale(1);
    }
}

@keyframes bloom {
    0% {
        transform: scale(0) rotate(-25deg);
        opacity: 0;
    }
    70% {
        transform: scale(1.12) rotate(5deg);
        opacity: 1;
    }
    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes ribbonIn {
    to {
        opacity: 1;
    }
}

@keyframes kittensIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* CORAZONES FLOTANTES */
.hearts span {
    position: fixed;
    bottom: -30px;
    color: #c98d99;
    font-size: 22px;
    animation: float 7s linear infinite;
    opacity: 0;
    pointer-events: none;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }
    15% {
        opacity: .7;
    }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

/* CELULARES */
@media(max-width: 500px) {
    .card {
        padding: 25px 10px;
    }

    h1 {
        font-size: 26px;
    }

    .foto-principal {
        width: 160px;
        height: 160px;
    }

    .garden {
        max-width: 100%;
    }

    .scene.show .garden {
        height: 390px;
    }

    .message h2 {
        font-size: 25px;
    }
}
</style>
</head>

<script>
function abrirRamo() {
    const escena = document.getElementById("scene");

    if (!escena.classList.contains("show")) {
        escena.classList.add("show");
    }
}
</script>
